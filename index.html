<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Log - Push Pull Legs</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff6b00;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed; /* Mantiene la larghezza delle colonne uniforme */
        }

        th, td {
            text-align: left;
            padding: 10px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            word-wrap: break-word; /* Evita che il testo lungo scompagini la tabella */
        }

        /* Definizione larghezze colonne */
        th:nth-child(1), td:nth-child(1) { width: 30%; } /* Esercizio */
        th:nth-child(2), td:nth-child(2) { width: 15%; } /* S x R */
        th:nth-child(3), td:nth-child(3) { width: 20%; } /* Carico */
        th:nth-child(4), td:nth-child(4) { width: 25%; } /* Note */
        th:nth-child(5), td:nth-child(5) { width: 10%; text-align: center; } /* Azione */

        th {
            color: var(--text-dim);
            font-weight: 600;
        }

        td[contenteditable="true"] {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            outline: none;
            padding: 6px;
        }

        td[contenteditable="true"]:focus {
            background-color: rgba(255, 107, 0, 0.2);
            border: 1px solid var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-delete {
            background-color: #d9534f;
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            th, td {
                font-size: 0.8rem;
                padding: 6px 3px;
            }
        }
    </style>
</head>
<body>

    <h1>🏋️ Scheda Allenamento</h1>

    <div id="workout-container"></div>

    <script>
        const initialData = [
            {
                day: "Giorno 1: PUSH (Petto, Spalle, Tricipiti)",
                exercises: [
                    { name: "Panca piana con bilanciere", setsReps: "4x10", weight: "30", notes: "" },
                    { name: "Spinta manubri / Chest Press", setsReps: "4x10", weight: "15", notes: "Provare Chest Press" },
                    { name: "Pectoral Machine", setsReps: "4x10", weight: "30", notes: "" },
                    { name: "Shoulder Press / Lento Avanti", setsReps: "3x8-10", weight: "12", notes: "Provare Shoulder Press" },
                    { name: "Alzate laterali", setsReps: "3x10", weight: "5", notes: "" },
                    { name: "Pushdown Lat Machine", setsReps: "3x12", weight: "20", notes: "Barra dritta" }
                ]
            },
            {
                day: "Giorno 2: PULL (Dorso, Deltoide Posteriore, Bicipiti)",
                exercises: [
                    { name: "Lat Machine avanti", setsReps: "4x8-10", weight: "40/50", notes: "" },
                    { name: "Pulley basso", setsReps: "3x8-10", weight: "35/45", notes: "" },
                    { name: "Rematore manubrio singolo", setsReps: "3x10-12", weight: "16/18", notes: "" },
                    { name: "Croci inverse Pectoral", setsReps: "3x12-15", weight: "20/30", notes: "" },
                    { name: "Curl bilanciere EZ", setsReps: "3x8-10", weight: "10/15", notes: "" },
                    { name: "Hammer Curl manubri", setsReps: "3x10-12", weight: "10/12", notes: "" }
                ]
            },
            {
                day: "Giorno 3: LEGS & CORE (Gambe e Addome)",
                exercises: [
                    { name: "Squat al Rack", setsReps: "4x6-8", weight: "40/55", notes: "" },
                    { name: "Leg Press", setsReps: "3x8-10", weight: "60/80", notes: "" },
                    { name: "Leg Extension", setsReps: "3x12-15", weight: "15/25", notes: "" },
                    { name: "Stacco rumeno manubri", setsReps: "3x10-12", weight: "14/16", notes: "" },
                    { name: "Calf Raise manubrio", setsReps: "4x15", weight: "10/14", notes: "" },
                    { name: "Crunch panca inclinata", setsReps: "3x15", weight: "-", notes: "" },
                    { name: "Plank", setsReps: "3x45-60s", weight: "Corpo libero", notes: "" }
                ]
            }
        ];

        function loadData() {
            const saved = localStorage.getItem("workoutData");
            return saved ? JSON.parse(saved) : initialData;
        }

        function saveData(data) {
            localStorage.setItem("workoutData", JSON.stringify(data));
        }

        function renderApp() {
            const data = loadData();
            const container = document.getElementById("workout-container");
            container.innerHTML = "";

            data.forEach((dayGroup, dayIndex) => {
                const card = document.createElement("div");
                card.className = "day-card";

                let html = `<h2 contenteditable="true" onblur="updateDayTitle(${dayIndex}, this.innerText)">${dayGroup.day}</h2>`;
                html += `
                    <table>
                        <thead>
                            <tr>
                                <th>Esercizio</th>
                                <th>S x R</th>
                                <th>Carico</th>
                                <th>Note</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                dayGroup.exercises.forEach((ex, exIndex) => {
                    html += `
                        <tr>
                            <td contenteditable="true" onblur="updateField(${dayIndex}, ${exIndex}, 'name', this.innerText)">${ex.name}</td>
                            <td contenteditable="true" onblur="updateField(${dayIndex}, ${exIndex}, 'setsReps', this.innerText)">${ex.setsReps}</td>
                            <td contenteditable="true" onblur="updateField(${dayIndex}, ${exIndex}, 'weight', this.innerText)">${ex.weight}</td>
                            <td contenteditable="true" onblur="updateField(${dayIndex}, ${exIndex}, 'notes', this.innerText)">${ex.notes}</td>
                            <td style="text-align: center;"><button class="btn btn-delete" onclick="deleteExercise(${dayIndex}, ${exIndex})">✕</button></td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                    <div class="controls">
                        <button class="btn" onclick="addExercise(${dayIndex})">+ Aggiungi Esercizio</button>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function updateField(dayIndex, exIndex, field, value) {
            const data = loadData();
            data[dayIndex].exercises[exIndex][field] = value;
            saveData(data);
        }

        function updateDayTitle(dayIndex, value) {
            const data = loadData();
            data[dayIndex].day = value;
            saveData(data);
        }

        function addExercise(dayIndex) {
            const data = loadData();
            data[dayIndex].exercises.push({ name: "Nuovo Esercizio", setsReps: "3x10", weight: "0 kg", notes: "" });
            saveData(data);
            renderApp();
        }

        function deleteExercise(dayIndex, exIndex) {
            const data = loadData();
            data[dayIndex].exercises.splice(exIndex, 1);
            saveData(data);
            renderApp();
        }

        renderApp();
    </script>
</body>
</html>
